name: Rename game file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f qi-huan-sen-lin-shu-xue-da-mou-xian-v5.html ]; then
            git config user.name "gg88505"
            git config user.email "gg88505@users.noreply.github.com"
            git mv qi-huan-sen-lin-shu-xue-da-mou-xian-v5.html index.html
            git commit -m "Rename game file to index.html"
            git push
          else
            echo "Source file not found; nothing to rename"
          fi
