name: Rename V12 to index.html

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-to-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with V12
        run: |
          git config user.name "gg88505"
          git config user.email "gg88505@users.noreply.github.com"
          rm -f index.html
          mv qi-huan-sen-lin-shu-xue-da-mou-xian-v12.html index.html
          git add -A
          git commit -m "Update to V12"
          git push
